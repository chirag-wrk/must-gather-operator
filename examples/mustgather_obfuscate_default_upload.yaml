# Mode 1: gather → obfuscate (default policy) → SFTP upload.
# Spec: SC-001 (no cleartext IP/MAC in upload), SC-002 (Secret/ConfigMap resources omitted),
#       SC-003 (consistent token replacement across files).
#
# Prerequisites:
#   - Service account with cluster gather permissions (e.g. must-gather-admin).
#   - Case-management secret in this CR's namespace for uploadTarget.sftp.
#   - No custom ConfigMap required; operator uses embedded default policy.
#
# See examples/README.md for Mode 2/3 and custom-policy (SC-004) variants.
apiVersion: operator.openshift.io/v1alpha1
kind: MustGather
metadata:
  name: example-mustgather-obfuscate-default
spec:
  serviceAccountName: must-gather-admin
  obfuscate:
    enabled: true
  uploadTarget:
    type: SFTP
    sftp:
      caseID: '02527285'
      caseManagementAccountSecretRef:
        name: case-management-creds
      internalUser: true
